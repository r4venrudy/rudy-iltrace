<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
  <title id="title">Rudy ILTrace</title>
  <desc id="desc">Follow the calls inside a .NET assembly. A navy and teal call-graph diagram.</desc>
  <defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#203342" fill="none"/></pattern></defs>
  <rect width="1200" height="350" rx="20" fill="#0b1118"/>
  <rect x="740" width="460" height="350" rx="20" fill="url(#grid)" opacity=".55"/>
  <path d="M0 26v298" stroke="#55e0b6" stroke-width="7"/>
  <text x="48" y="62" font-family="Consolas,monospace" font-size="14" letter-spacing="4" fill="#55e0b6">RUDY SYSTEMS / MANAGED CODE REVIEW</text>
  <text x="46" y="140" font-family="Segoe UI,Arial,sans-serif" font-weight="700" font-size="58" fill="#f0f6fc">Rudy ILTrace</text>
  <text x="49" y="184" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#b5cadd">Follow the calls inside a .NET assembly.</text>
  <text x="49" y="222" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#8ba4b8">Metadata. IL graphs. Capability paths. Release diffs.</text>
  <path d="M48 272H700" stroke="#233342"/>
  <text x="49" y="308" font-family="Consolas,monospace" font-size="14" letter-spacing="2" fill="#55e0b6">C# / .NET 10 / OFFLINE / MIT</text>
  <g font-family="Consolas,monospace" font-size="13" text-anchor="middle">
    <g fill="#101e2a" stroke="#294557"><rect x="810" y="50" width="300" height="44" rx="7"/><rect x="810" y="134" width="300" height="44" rx="7"/><rect x="810" y="218" width="300" height="44" rx="7"/></g>
    <g fill="#dbe8f2"><text x="960" y="77">ENTRY / PUBLIC ROOT</text><text x="960" y="161">DECLARED IL CALLS</text><text x="960" y="245">REVIEW BOUNDARIES</text></g>
    <path d="M960 94v40m-5-7 5 7 5-7M960 178v40m-5-7 5 7 5-7" fill="none" stroke="#55e0b6" stroke-width="2"/>
    <text x="960" y="307" fill="#8ba4b8" font-size="11">STATIC MODEL / EXPLICIT COVERAGE</text>
  </g>
</svg>
