name: Package preview
on:
  push:
    tags: ['v*']
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build, test and package
        shell: pwsh
        run: ./scripts/Package.ps1 -OutputDirectory artifacts/release
      - uses: softprops/action-gh-release@v2
        with:
          name: Rudy ILTrace ${{ github.ref_name }}
          body_path: docs/RELEASE_NOTES.md
          prerelease: true
          files: |
            artifacts/release/*.zip
            artifacts/release/*.nupkg
            artifacts/release/SHA256SUMS
