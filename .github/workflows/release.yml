name: Package preview
on:
  push:
    tags: ['v*']
permissions:
  contents: write

# Do not overlap publication attempts for the same release ref.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - name: Build, test and package
        shell: pwsh
        run: ./scripts/Package.ps1 -OutputDirectory artifacts/release
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: Rudy ILTrace ${{ github.ref_name }}
          body_path: docs/RELEASE_NOTES.md
          prerelease: true
          files: |
            artifacts/release/*.zip
            artifacts/release/*.nupkg
            artifacts/release/SHA256SUMS
