name: Build and verify
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Replace stale PR checks without canceling push, manual, or release runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    name: ${{ matrix.os }}
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - name: Build with warnings as errors
        run: dotnet build Rudy.ILTrace.slnx -c Release
      - name: Regression and CLI checks
        run: dotnet run --project tests/Rudy.ILTrace.Tests -c Release --no-build -- .
      - name: Pack tool
        run: dotnet pack src/Rudy.ILTrace.Cli -c Release --no-build -o artifacts
      - name: Install local tool package
        run: dotnet tool install Rudy.ILTrace.Tool --version 0.1.0 --tool-path .tools --add-source artifacts --configfile NuGet.Config
      - name: Installed tool smoke
        shell: pwsh
        run: |
          $tool = Join-Path (Get-Location) '.tools/rudy-iltrace'
          if ($IsWindows) { $tool += '.exe' }
          & $tool --version
          if ($LASTEXITCODE -ne 0) { throw 'Installed version check failed.' }
          & $tool trace tests/Fixtures/Probe/bin/Release/net10.0/Probe.dll --category process --format json --output artifacts/tool-trace.json
          if ($LASTEXITCODE -ne 0) { throw 'Installed trace failed.' }
          $report = Get-Content -Raw artifacts/tool-trace.json | ConvertFrom-Json
          if ($report.paths.Count -lt 1) { throw 'Expected a process capability path.' }
